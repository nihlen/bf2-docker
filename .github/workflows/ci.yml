name: CI

# Tests all images and builds, smoke tests and pushes the images that changed.
# Images are pushed from the branches in PUSH_BRANCHES and from manual runs, never from pull requests:
#   images/netsky-<name>  ->  $REGISTRY/$PROJECT/bf2-netsky:<name>
#   images/<name>         ->  $REGISTRY/$PROJECT/bf2-docker:<name>
# They are pushed over the tailnet to $PUSH_REGISTRY (the same Harbor, tailnet only), since the image layers are
# larger than Cloudflare's 100 MB upload limit on $REGISTRY.
#
# Repository settings:
#   secrets.CR_USERNAME, secrets.CR_PASSWORD         Container registry account with push access
#   secrets.TS_OAUTH_CLIENT_ID, secrets.TS_AUDIENCE  Tailscale federated identity (OIDC) trust credential for this
#                                                    repo, with the auth_keys scope and tag:ci
#   vars.PUSH_BRANCHES                               Branches to push images from, separated by spaces (default: master)

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      images:
        description: 'Images to build, separated by spaces, or "all"'
        default: all
      push:
        description: Push the images to the container registry
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: cr.nihlen.net
  PUSH_REGISTRY: cr-ts.nihlen.net
  PROJECT: library

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: tests/run.sh static

  changes:
    name: Find changed images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: images
        env:
          EVENT: ${{ github.event_name }}
          INPUT_IMAGES: ${{ inputs.images }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            workflow_dispatch)
              if [ "$INPUT_IMAGES" = 'all' ]; then
                images=$(.github/scripts/changed-images.sh all)
              else
                read -ra list <<< "$INPUT_IMAGES"
                images=$(printf '%s\n' "${list[@]}" | jq -R . | jq -sc .)
              fi ;;
            pull_request) images=$(.github/scripts/changed-images.sh "$PR_BASE") ;;
            *) images=$(.github/scripts/changed-images.sh "$PUSH_BASE") ;;
          esac
          echo "Images: $images"
          echo "images=$images" >> "$GITHUB_OUTPUT"

  image:
    name: ${{ matrix.image }}
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Tailscale federated identity
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v5

      - name: Build test
        run: tests/run.sh build ${{ matrix.image }}

      - name: Smoke test
        run: tests/run.sh smoke ${{ matrix.image }}

      - name: Check if the image should be pushed
        id: push
        env:
          EVENT: ${{ github.event_name }}
          INPUT_PUSH: ${{ inputs.push }}
          BRANCH: ${{ github.ref_name }}
          PUSH_BRANCHES: ${{ vars.PUSH_BRANCHES || 'master' }}
        run: |
          push=false
          if [ "$EVENT" = 'workflow_dispatch' ]; then
            push="$INPUT_PUSH"
          elif [ "$EVENT" = 'push' ] && [[ " $PUSH_BRANCHES " == *" $BRANCH "* ]]; then
            push=true
          fi
          echo "Push: $push"
          echo "push=$push" >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        if: steps.push.outputs.push == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: pve-gateway

      - name: Log in to the container registry
        if: steps.push.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.PUSH_REGISTRY }}
          username: ${{ secrets.CR_USERNAME }}
          password: ${{ secrets.CR_PASSWORD }}

      # Push the image that was tested, overwriting the previous one
      - name: Push to the container registry
        if: steps.push.outputs.push == 'true'
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          case "$IMAGE" in
            netsky-*) repo="$PROJECT/bf2-netsky:${IMAGE#netsky-}" ;;
            *) repo="$PROJECT/bf2-docker:$IMAGE" ;;
          esac
          docker tag "bf2-docker-test/$IMAGE" "$PUSH_REGISTRY/$repo"
          docker push "$PUSH_REGISTRY/$repo"
          echo "Pushed \`$REGISTRY/$repo\`" >> "$GITHUB_STEP_SUMMARY"
