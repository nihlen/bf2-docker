name: CI

# Tests all images and builds, smoke tests and pushes the images that changed.
# Images are pushed from the branches in PUSH_BRANCHES and from manual runs, never from pull requests:
#   images/<image>  ->  $REGISTRY/$PROJECT/bf2-docker:<image>
# They are pushed over the tailnet to $PUSH_REGISTRY (the same Harbor, tailnet only), since the image layers are
# larger than Cloudflare's 100 MB upload limit on $REGISTRY.
# They are not pushed to Docker Hub or GitHub's registry: the images hold EA's server files, whose license
# (readmes/eula.txt in the server) does not allow distributing them.
#
# Repository settings:
#   secrets.CR_USERNAME, secrets.CR_PASSWORD         Container registry account with push access
#   secrets.TS_OAUTH_CLIENT_ID, secrets.TS_AUDIENCE  Tailscale federated identity (OIDC) trust credential for this
#                                                    repo, with the auth_keys scope and tag:ci
#   vars.PUSH_BRANCHES                               Branches to push images from, separated by spaces (default: master)

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      images:
        description: 'Images to build, separated by spaces, or "all"'
        default: all
      push:
        description: Push the images to the container registry
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: cr.nihlen.net
  PUSH_REGISTRY: cr-ts.nihlen.net
  PROJECT: library

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: tests/run.sh static

  changes:
    name: Find changed images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: images
        env:
          EVENT: ${{ github.event_name }}
          INPUT_IMAGES: ${{ inputs.images }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            workflow_dispatch)
              if [ "$INPUT_IMAGES" = 'all' ]; then
                images=$(.github/scripts/changed-images.sh all)
              else
                read -ra list <<< "$INPUT_IMAGES"
                images=$(printf '%s\n' "${list[@]}" | jq -R . | jq -sc .)
              fi ;;
            pull_request) images=$(.github/scripts/changed-images.sh "$PR_BASE") ;;
            *) images=$(.github/scripts/changed-images.sh "$PUSH_BASE") ;;
          esac
          echo "Images: $images"
          echo "images=$images" >> "$GITHUB_OUTPUT"

  image:
    name: ${{ matrix.image }}
    needs: changes
    if: needs.changes.outputs.images != '[]'
    # Not ubuntu-latest: on ubuntu-26.04 the BF2CC Daemon's Mono 1.1.12 (bf2hub-pb-mm-bf2cc) crashes at start, in
    # System.Net.Dns.Resolve. The other images pass their tests there too
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # Tailscale federated identity
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v5

      - name: Build test
        run: tests/run.sh build ${{ matrix.image }}

      - name: Smoke test
        run: tests/run.sh smoke ${{ matrix.image }}

      - name: Check if the image should be pushed
        id: push
        env:
          EVENT: ${{ github.event_name }}
          INPUT_PUSH: ${{ inputs.push }}
          BRANCH: ${{ github.ref_name }}
          PUSH_BRANCHES: ${{ vars.PUSH_BRANCHES || 'master' }}
        run: |
          push=false
          if [ "$EVENT" = 'workflow_dispatch' ]; then
            push="$INPUT_PUSH"
          elif [ "$EVENT" = 'push' ] && [[ " $PUSH_BRANCHES " == *" $BRANCH "* ]]; then
            push=true
          fi
          echo "Push: $push"
          echo "push=$push" >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        if: steps.push.outputs.push == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: pve-gateway

      # For the log: the runner's NAT (MappingVariesByDestIP: true is a NAT that Tailscale can't punch through) and
      # whether the registry is reached directly or through a relay (DERP)
      - name: Show the Tailscale connection
        if: steps.push.outputs.push == 'true'
        run: |
          sudo tailscale netcheck || true
          sudo tailscale ping -c 5 pve-gateway || true

      - name: Log in to the container registry
        if: steps.push.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.PUSH_REGISTRY }}
          username: ${{ secrets.CR_USERNAME }}
          password: ${{ secrets.CR_PASSWORD }}

      # Push the image that was tested, overwriting the previous one. The registry can lose the uploads that are in
      # progress ("blob upload unknown to registry") and a push can hang, so a push that fails or takes too long is
      # tried again; the layers that were pushed are kept
      - name: Push to the container registry
        if: steps.push.outputs.push == 'true'
        timeout-minutes: 50
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          repo="$PROJECT/bf2-docker:$IMAGE"
          docker tag "bf2-docker-test/$IMAGE" "$PUSH_REGISTRY/$repo"
          for attempt in 1 2 3; do
            if timeout 15m docker push "$PUSH_REGISTRY/$repo"; then
              echo "Pushed \`$REGISTRY/$repo\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::warning::Push of $IMAGE failed or took more than 15 minutes (attempt $attempt of 3)"
            sleep $((attempt * 30))
          done
          exit 1
